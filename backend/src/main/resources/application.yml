debug: false
spring:
  application:
    name: archecode
  flyway:
    enabled: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        hbm2ddl:
          auto: none
        temp:
          use_jdbc_metadata_defaults: false
    show-sql: true
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://database:3306/db
    username: root
    password: password!
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialize: false
    initialSize: 0

  sql:
    init:
      continue-on-error: true
server:
  port: 8080

jwt:
  secret: secret-key-min-32-symbols-but-better-256-so-please-be-careful-with-this
  expiration: 900000
  refresh:
    expiration: 259200000
