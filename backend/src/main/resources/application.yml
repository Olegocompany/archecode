debug: ${DEBUG_ENABLED:false}
spring:
  application:
    name: archecode
  flyway:
    enabled: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: ${DEBUG_ENABLED:false}
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  config:
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}
  servlet:
    contextPath: ${CONTEXT_PATH:/api}
    context-path: ${CONTEXT_PATH:/api}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh:
    expiration: ${REFRESH_EXPIRATION:900000}

filesystem:
  endpoint: ${S3_ENDPOINT}
  accessKey: ${S3_ACCESSKEY}
  secretKey: ${S3_SECRETKEY}
  avatars:
    bucket-name: ${S3_BUCKET_USERAVATARS:avatars}
    prefix: "avatar_"
