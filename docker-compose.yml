volumes:
  db-dev:

networks:
  databased:
    driver: bridge

services:
  database:
    image: mysql
    container_name: archecode-mysql-database
    restart: on-failure
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-db}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:-password!}
      MYSQL_USER: ${USER:-user}
      MYSQL_PASSWORD: ${PASSWORD:-password}
    volumes:
      - db-dev:/var/lib/mysql
    networks:
      - databased

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - database
    networks:
      - databased
    ports:
      - "8080:8080"